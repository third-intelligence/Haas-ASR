<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haas-ja-v1.0 · リアルタイム文字起こしデモ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <div class="brand">Haas-ja-v1.0</div>
          <h1 data-t="title">リアルタイム文字起こしデモ</h1>
        </div>
        <nav>
          <a href="/longform" data-t="navLongform">長時間音声</a>
          <a href="/realtime" aria-current="page" data-t="navRealtime">リアルタイム</a>
        </nav>
        <div class="status" id="status"><i></i><span>…</span></div>
      </header>

      <div class="source">
        <button class="chip primary" id="mic"><i></i><span id="mic-label" data-t="mic">マイクで話す</span></button>
        <button class="chip dashed" id="pick"><span id="pick-label" data-t="pick">音声ファイルを再生…</span></button>
        <input type="file" id="file" accept="audio/*" hidden />
      </div>

      <section class="stage">
        <div class="stats">
          <div class="stat"><div class="k" data-t="delay">遅延（エンドツーエンド・中央値）</div><div class="v"><span id="m-delay">–</span><small>ms</small></div></div>
          <div class="stat"><div class="k" data-t="model">モデル処理</div><div class="v"><span id="m-model">–</span><small>ms</small></div></div>
          <div class="stat"><div class="k" data-t="audioLen">音声の長さ</div><div class="v" id="m-audio">–</div></div>
        </div>
        <div class="wave">
          <canvas id="wave"></canvas>
          <div class="axis" id="axis"></div>
        </div>
        <div class="caption">
          <span class="state off" id="state"><i></i><span id="state-text" data-t="idle">待機中</span></span>
          <span class="legend">
            <span><b class="settled"></b><span data-t="settled">確定</span></span>
            <span><b class="pending"></b><span data-t="pending">認識中</span></span>
          </span>
        </div>
      </section>

      <div class="transcript" id="transcript"><div class="hint" data-t="empty">マイクで話すか音声ファイルを再生すると、ここに書き起こしが表示されます</div></div>
    </div>
    <script type="module" src="/static/realtime.js"></script>
  </body>
</html>
